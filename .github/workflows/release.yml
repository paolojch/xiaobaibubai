name: Build xiaobaibubai Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_key: windows
          - os: macos-latest
            platform_key: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run test suite
        run: |
          python -m unittest discover -s tests -v

      - name: Build standalone package
        run: |
          python build_release.py

      - name: Upload Windows artifact
        if: matrix.platform_key == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: xiaobaibubai-Windows
          path: dist/xiaobaibubai-Windows.exe

      - name: Upload macOS artifacts
        if: matrix.platform_key == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: xiaobaibubai-macOS
          path: |
            dist/xiaobaibubai-macOS.dmg
            dist/xiaobaibubai-macOS.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/xiaobaibubai-Windows.exe
            release-files/xiaobaibubai-macOS.dmg
            release-files/xiaobaibubai-macOS.zip
          generate_release_notes: true
